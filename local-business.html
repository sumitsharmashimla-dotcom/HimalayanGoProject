<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HimalayanGo — Local Business</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f8fa;color:#17202a}header{background:#fff;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:15px;box-shadow:0 2px 10px #0001}.logo{font-size:22px;font-weight:800;color:#0877bd}nav{display:flex;gap:15px;flex-wrap:wrap}nav a{text-decoration:none;color:#555;font-weight:600}.wrap{max-width:1150px;margin:35px auto;padding:0 18px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{padding:12px;border:1px solid #d8dee6;border-radius:9px;flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 5px 18px #0001}.card img{width:100%;height:200px;object-fit:cover}.content{padding:18px}.badge{display:inline-block;background:#e8f4ff;color:#0877bd;padding:5px 8px;border-radius:6px;font-size:12px;font-weight:bold}.desc{color:#667085;font-size:14px;line-height:1.5}.buttons{display:flex;gap:8px}.btn{flex:1;text-align:center;background:#0877bd;color:white;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold}.wa{background:#1f9d55}
</style></head><body><header><div class="logo">🏔️ HimalayanGo</div><nav><a href="index.html">Home</a><a href="recharge.html">Bills & Recharge</a><a href="shopping.html">Shopping</a><a href="local-business.html">Local Business</a></nav></header>
<div class="wrap"><h1>Local Businesses & Handicrafts</h1><p>Explore cafes, handicrafts, homestays and other local services.</p>
<div class="tools"><input id="search" placeholder="Search business..." oninput="render()"><select id="cat" onchange="render()"><option value="">All categories</option><option>Cafe & Dining</option><option>Handicrafts & Woolens</option><option>Homestay & Stays</option></select></div>
<div id="grid" class="grid"></div></div>
<script>
const businesses=[
{name:"Hills Brew & Cafe",cat:"Cafe & Dining",desc:"Local pahadi snacks, coffee and mountain-view ambience.",img:"https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80",map:"https://maps.google.com",phone:""},
{name:"Himachali Kullu Shawls & Art",cat:"Handicrafts & Woolens",desc:"Traditional shawls, stoles, caps and wool garments.",img:"https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?auto=format&fit=crop&w=800&q=80",map:"https://maps.google.com",phone:""},
{name:"Pine Valley Homestay",cat:"Homestay & Stays",desc:"Traditional hospitality, home-cooked meals and peaceful surroundings.",img:"https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80",map:"https://maps.google.com",phone:""}
];
function render(){let q=search.value.toLowerCase(),c=cat.value;grid.innerHTML=businesses.filter(b=>(!q||b.name.toLowerCase().includes(q)||b.desc.toLowerCase().includes(q))&&(!c||b.cat===c)).map(b=>`<div class="card"><img src="${b.img}" alt="${b.name}"><div class="content"><span class="badge">${b.cat}</span><h3>${b.name}</h3><p class="desc">${b.desc}</p><div class="buttons"><a class="btn" target="_blank" href="${b.map}">Location</a><a class="btn wa" target="_blank" href="${b.phone?'https://wa.me/91'+b.phone:'#'}" onclick="${b.phone?'':'alert(\\'Owner contact number add karein.\\');return false'}">WhatsApp</a></div></div></div>`).join("")||"<p>No business found.</p>"}
render();
</script></body></html>
